<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Consulta de Preços — Depósito de Bebidas Reunidas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">R$</div>
        <div class="brand-text">
          <h1>Depósito de Bebidas Reunidas</h1>
          <p>Consulta Rápida de Preços</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggleCostBtn" class="btn btn-sm" title="Mostrar ou ocultar preço de custo da Nota Fiscal">
          👁️ Custo
        </button>
        <button id="toggleMarginColBtn" class="btn btn-sm" title="Mostrar ou ocultar a porcentagem de margem nos produtos">
          👁️ Margem %
        </button>
        <button id="toggleMarginsBtn" class="btn btn-sm btn-primary" title="Abrir tabela geral de margens por categoria">
          ⚙️ Tabela %
        </button>
      </div>
    </div>

    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Buscar produto, marca ou código de barras..."
        autocomplete="off"
        autofocus
      >
      <button id="clearSearchBtn" class="clear-btn">✕</button>
    </div>
  </header>

  <main class="container">
    <!-- Painel de Margens de Lucro (Fechado por padrão para não poluir a tela) -->
    <section id="marginsPanel" class="margins-panel closed">
      <div class="margins-header">
        <h3>📊 Margem Padrão por Categoria</h3>
        <button id="resetMarginsBtn" class="btn btn-sm">Restaurar Padrão</button>
      </div>
      <div id="marginsGrid" class="margins-grid"></div>
    </section>

    <!-- Filtros Rápidos por Categoria -->
    <div id="categoriesBar" class="categories-bar"></div>

    <!-- Card em Destaque (Visor de Caixa) ao pesquisar -->
    <section id="spotlight" class="spotlight"></section>

    <!-- Barra de status discreta -->
    <div class="status-bar">
      <span id="resultCount">Carregando...</span>
      <span class="hint-text">Toque no preço ou % para editar</span>
    </div>

    <!-- Lista de Produtos Responsiva (Tabela no PC / Cards limpos no Celular) -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th class="col-custo">Custo NF</th>
            <th class="col-margem">Margem</th>
            <th>Preço Unidade</th>
            <th>Preço Caixa / Fardo</th>
          </tr>
        </thead>
        <tbody id="productsTbody"></tbody>
      </table>
    </div>
  </main>

  <script src="produtos.js"></script>
  <script src="app.js"></script>
</body>
</html>
